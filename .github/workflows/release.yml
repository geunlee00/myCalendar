# v로 시작하는 태그(예: v1.0.0)를 올리면 실행 파일을 만들어 GitHub 릴리스에 올린다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 실행 파일 만들기
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish CalendarWidget.csproj -p:PublishProfile=win-x64 -p:Version=$version

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          files: bin/publish/CalendarWidget.exe
          body: |
            ## 내려받기

            아래 **CalendarWidget.exe**를 내려받아 원하는 폴더에 두고 더블클릭하면 바로 실행됩니다.
            설치나 .NET 설치가 필요 없습니다. (Windows 10/11 64비트)

            처음 실행할 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요.
            자세한 사용법은 [README](https://github.com/${{ github.repository }}#readme)를 보세요.
